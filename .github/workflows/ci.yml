name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit ruff
          python -m pip install -e ".[test]"

      - name: High-confidence Ruff checks
        run: ruff check polars_ti tests scripts --select E9,F63,F7,F82,RUF100,RUF103,RUF104

      - name: Syntax check
        run: python -m compileall -q polars_ti tests scripts

      - name: Enforce runtime pandas purge
        run: |
          ! grep -R -n -E "import pandas|from pandas|\bpd\." polars_ti --include="*.py"
          ! grep -R -n -E "import pandas|from pandas|\bpd\." tests --include="*_polars.py"
          ! grep -R -n -E "import pandas|from pandas|\bpd\." tests/conftest.py

      - name: Run tests
        run: python -m pytest --tb=short -q

      - name: Dependency audit
        run: pip-audit --desc off --progress-spinner off
