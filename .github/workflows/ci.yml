name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"

      - name: Install dependencies
        run: uv sync --extra test --dev --locked

      - name: Ruff lint
        run: uv run ruff check polars_ti tests scripts

      - name: Ruff format
        run: uv run ruff format --check polars_ti tests scripts

      - name: Mypy strict
        run: |
          # Include the audit package alongside production code.
          targets=(polars_ti)
          [[ -d scripts ]] && targets+=(scripts)
          uv run mypy --strict "${targets[@]}"

      - name: Syntax check
        run: uv run python -m compileall -q polars_ti tests scripts

      - name: Enforce runtime pandas purge
        run: |
          ! grep -R -n -E "import pandas|from pandas|\bpd\." polars_ti --include="*.py"
          ! grep -R -n -E "import pandas|from pandas|\bpd\." tests --include="*_polars.py"
          ! grep -R -n -E "import pandas|from pandas|\bpd\." tests/conftest.py

  test:
    # Test the compatibility floor and locked release on every supported Python.
    # Keep TA-Lib absent as a real environment so native-only defects cannot hide.
    name: Test (py${{ matrix.python-version }}, polars ${{ matrix.polars }}, talib=${{ matrix.talib }})
    runs-on: ubuntu-latest
    env:
      # Override the developer default in .python-version for each matrix row.
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        # "lock" reproduces uv.lock; 1.41.1 is the exact supported floor.
        # 1.41.0 is yanked on PyPI, so it is deliberately excluded.
        polars: ["lock", "1.41.1"]
        talib: ["on", "off"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (with TA-Lib)
        if: matrix.talib == 'on'
        run: uv sync --extra test --dev --locked

      - name: Install dependencies (without TA-Lib)
        if: matrix.talib == 'off'
        # Sync only the runtime + test deps, omitting the TA-Lib extra, so the
        # native (no-TA-Lib) code paths are exercised. SciPy remains installed
        # because native FIR convolution and regression use it directly.
        run: |
          uv sync --dev --no-default-groups --locked
          # Reuse the locked test dependencies while omitting only TA-Lib.
          uv export --extra test --locked --no-hashes --no-emit-project --no-emit-package ta-lib --output-file native-test-requirements.txt
          uv pip install -r native-test-requirements.txt

      - name: Install the supported Polars floor
        if: matrix.polars != 'lock'
        run: uv pip install "polars==${{ matrix.polars }}"

      - name: Verify the selected environment
        # Fail if interpreter selection or a later sync silently changed a matrix row.
        env:
          EXPECTED_POLARS: ${{ matrix.polars }}
          EXPECTED_TALIB: ${{ matrix.talib }}
        run: |
          uv run --no-sync python - <<'PY'
          import importlib.util
          import os
          import sys
          import tomllib
          from pathlib import Path
          import polars
          assert f"{sys.version_info.major}.{sys.version_info.minor}" == os.environ["UV_PYTHON"]
          expected = os.environ["EXPECTED_POLARS"]
          if expected == "lock":
              lock = tomllib.loads(Path("uv.lock").read_text())
              expected = next(package["version"] for package in lock["package"] if package["name"] == "polars")
          assert polars.__version__ == expected
          assert (importlib.util.find_spec("talib") is not None) == (os.environ["EXPECTED_TALIB"] == "on")
          print(sys.version, "Polars", polars.__version__, "TA-Lib", os.environ["EXPECTED_TALIB"])
          PY

      # --no-sync preserves the selected floor and TA-Lib absence instead of
      # restoring the default lock environment immediately before testing.
      # TA-Lib present: full suite with coverage gate.
      - name: Run tests (with TA-Lib)
        if: matrix.talib == 'on'
        run: uv run --no-sync pytest tests/ -q --tb=short --cov=polars_ti --cov-report=term-missing --cov-fail-under=90

      # TA-Lib absent: exercises the native (Numba) code paths. WS2-WS4 fixed
      # the native indicators; parity tests that grade against the TA-Lib golden
      # skip automatically when TA-Lib is missing (tests/conftest.py HAS_TALIB),
      # and native-mode parity is enforced against the OLD native golden by
      # tests/test_native_parity.py. This leg is now a hard gate.
      - name: Run tests (without TA-Lib)
        if: matrix.talib == 'off'
        run: uv run --no-sync pytest tests/ -q --tb=short

  security:
    name: Runtime Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: pip-audit
        run: |
          uv export --extra test --format requirements-txt --no-hashes --output-file requirements-audit.txt
          uv run pip-audit -r requirements-audit.txt --desc off --progress-spinner off
