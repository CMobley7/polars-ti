name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra test --dev

      - name: Ruff lint
        run: uv run ruff check polars_ti tests scripts

      - name: Ruff format
        run: uv run ruff format --check polars_ti tests scripts

      - name: Mypy strict
        run: uv run mypy --strict polars_ti scripts

      - name: Syntax check
        run: uv run python -m compileall -q polars_ti tests scripts

      - name: Enforce runtime pandas purge
        run: |
          ! grep -R -n -E "import pandas|from pandas|\bpd\." polars_ti --include="*.py"
          ! grep -R -n -E "import pandas|from pandas|\bpd\." tests --include="*_polars.py"
          ! grep -R -n -E "import pandas|from pandas|\bpd\." tests/conftest.py

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra test --dev

      - name: Run tests
        run: uv run pytest tests/ -q --tb=short --cov=polars_ti --cov-report=term-missing --cov-fail-under=90

  security:
    name: Runtime Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: pip-audit
        run: |
          uv export --format requirements-txt --no-hashes --output-file requirements-audit.txt
          uv run pip-audit -r requirements-audit.txt --desc off --progress-spinner off
