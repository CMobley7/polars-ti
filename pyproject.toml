[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["polars_ti"]

[project]
name = "polars_ti"
version = "0.1.0"
authors = [
  { name="Christopher Mobley" },
]
description = "Polars Technical Indicators (Polars-TI) is a free, open-source technical analysis library built on a pure Polars/Numba/NumPy architecture. It provides 200+ indicators and candlestick patterns as native Polars expressions, with zero runtime pandas dependency."
readme = "README.md"
license = { file="LICENSE" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Investment",
]
keywords = [
    "technical indicators", "finance", "trading", "backtest", "pandas", "numpy", "numba", "vectorbt", "yfinance", "python3"
]

dependencies = [
    "numba~=0.63.1",
    "numpy~=2.3.5",
    "polars>=1.0.0",
]

[project.urls]
"Homepage" = "https://github.com/CMobley7/polars-ti"
"Bug Tracker" = "https://github.com/CMobley7/polars-ti/issues"
"Download" = "https://github.com/CMobley7/polars-ti.git"

[project.optional-dependencies]
talib = [
    "TA-Lib~=0.6.8",
]
full = [
    "polars-ti[test,talib]",
    "vectorbt",
    "matplotlib~=3.10.8",
    "alpha-vantage",
    "mplfinance",
    "python-dotenv",
    "scikit-learn",
    "statsmodels",
    "stochastic",
    "tqdm",
]
test = [
    "polars-ti[talib]",
    "pandas~=2.3.3",
    "yfinance~=1.0",
    "pytest~=9.0.2",
]

[dependency-groups]
dev = [
    "mypy",
    "pip-audit",
    "pytest-cov",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    "dist",
    "docs",
    "examples",
    "tmp",
    "verification_logs",
]

[tool.ruff.lint]
ignore = [
    "E402",
    "E711",
    "E741",
    "F401",
    "F403",
    "F405",
    "F541",
    "F811",
    "F841",
]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
exclude = [
    "tests",
    "docs",
    "examples",
]

[[tool.mypy.overrides]]
module = [
    "polars_ti",
    "polars_ti.*",
    "scripts.*",
]
ignore_errors = true

[tool.coverage.run]
source = ["polars_ti"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
omit = [
    "polars_ti/candles/cdl_inside.py",
